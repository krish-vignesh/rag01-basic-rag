services: #To run the OpenSearch and OpenSearch Dashboards containers, you can use the following docker-compose.yml file. This configuration sets up a single-node OpenSearch instance along with its corresponding dashboard interface.

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: rag01-opensearch

    environment:
      - discovery.type=single-node #Set the discovery type to single-node for a standalone OpenSearch instance.
      - bootstrap.memory_lock=true #Set bootstrap.memory_lock to true to prevent the JVM from swapping memory to disk.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" #Set the Java heap size to 512MB for both minimum and maximum values. Adjust these values based on your system's available memory and workload requirements.

    expose:
      - "9200" # API port
      - "9600" # Performance Analyzer port 

    volumes:
      - opensearch-data:/usr/share/opensearch/data # Mount a volume for the OpenSearch data directory.

    ulimits:
      memlock:
        soft: -1 #ulimit settings to allow the OpenSearch container to lock memory and prevent it from being swapped out. The soft limit is set to -1, which means unlimited, and the hard limit is also set to -1.
        hard: -1
      nofile:
        soft: 65536 #The nofile ulimit settings specify the maximum number of open file descriptors for the OpenSearch container. The soft limit is set to 65536, which means that the container can have up to 65536 open files at any given time. The
        hard: 65536


  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: rag01-opensearch-dashboards

    ports:
      - "5601:5601"

    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch:9200"]' #opensearch-dashboards container is configured to connect to the OpenSearch container using the specified host URL. The URL points to the OpenSearch container's hostname (opensearch) and the API port (9200).
      - OPENSEARCH_USERNAME=kibanaserver #The OPENSEARCH_USERNAME environment variable is set to kibanaserver, which is the username used to authenticate with the OpenSearch instance. This username should have the necessary permissions to access and manage the OpenSearch data.
      - OPENSEARCH_PASSWORD=kibanaserver
      - OPENSEARCH_SSL_VERIFICATIONMODE=none

    depends_on: #Used to specify the dependencies between services in a Docker Compose file. In this case, it indicates that the opensearch-dashboards service depends on the opensearch service. This means that the opensearch service will be started before the opensearch-dashboards service.
      - opensearch
  

  postgres:
    image: postgres:17
    container_name: rag01-postgres
    restart: unless-stopped #The restart policy is set to unless-stopped, which means that the container will automatically restart unless it is explicitly stopped by the user. This ensures that the PostgreSQL container remains running even if it encounters an error or if the Docker daemon is restarted.

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: 
      context: .
      dockerfile: Dockerfile

    image: rag01-backend:0.1.1
    container_name: rag01-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    expose:
      - "8000"
    depends_on:
      - postgres
      - opensearch

  nginx:
    image: nginx:1.28.0
    container_name: rag01-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  


volumes:
  opensearch-data:
  postgres-data: