[project]
name = "rag01-backend"
version = "0.1.0"
description = "Backend application for the RAG01 system"
requires-python = ">=3.11,<3.12"
dependencies = [
    # API and server
    "fastapi==0.141.1",
    "uvicorn==0.48.0",
    "python-multipart==0.0.32",

    # Validation and configuration
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",

    # Database
    "SQLAlchemy==2.0.50",
    "psycopg[binary]==3.3.6",

    # Azure storage and authentication
    "azure-core==1.41.0",
    "azure-identity==1.26.0",
    "azure-storage-blob==12.31.0",

    # Document processing
    "pypdf==6.12.2",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",

    # LangChain and vector storage
    "langchain==1.3.4",
    "langchain-core==1.6.2",
    "langchain-chroma==1.1.0",
    "chromadb==1.5.9",

    # Embeddings and reranking
    "sentence-transformers==5.5.1",
    "langchain-huggingface==1.2.2",

    # Sparse retrieval and search indexing
    "rank-bm25==0.2.2",
    "opensearch-py==3.2.0",

    # LLM integration
    "langchain-nvidia-ai-endpoints==1.4.3",

    # Existing project utilities
    "pandas==3.0.3",
    "langsmith==0.8.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
